<!DOCTYPE HTML>
    <head lang="en">
        <title>Update webbrowser or enable javaScript!</title>
        <meta charset="utf-8" />
        <meta name="robots" content="noindex">
        <link href="/css/style.css" rel="stylesheet" />
    </head>

    <body>
        <div id="wrapper">
            <div class="content">

                <h1>Your browser does not support javaScript, or it is disabled.</h1>
                <h3>Update to one of the following browser versions.</h3>

                <p class="tagline">
                    <img src="/img/vink.gif" alt="" /> New Features
                    <img src="/img/vink.gif" alt="" /> Updated Technology
                    <img src="/img/vink.gif" alt="" /> Security Features
                    <img src="/img/vink.gif" alt="" /> Faster Browsing
                    <img src="/img/vink.gif" alt="" /> Look and Feel
                </p>

                <div class="downloads">
                    <div class="download">
                        <h6>Chrome</h6>
                        <p><a href="http://www.google.com/chrome" target="_blank">Download</a></p>
                    </div><!-- end .download -->

                    <div class="download">
                        <h6>Firefox</h6>
                        <p><a href="http://www.mozilla.org/firefox" target="_blank">Download</a></p>
                    </div><!-- end .download -->

                    <div class="download">
                        <h6>Safari</h6>
                        <p><a href="http://www.apple.com/safari/" target="_blank">Download</a></p>
                    </div><!-- end .download -->

                    <div class="download">
                        <h6>Internet Explorer</h6>
                        <p><a href="http://windows.microsoft.com/nl-nl/internet-explorer/products/ie/home" target="_blank">Download</a></p>
                    </div><!-- end .download -->

                </div><!-- end .downloads -->
            </div><!-- end .content -->
        </div><!-- end #wrapper -->
    </body>
</html>
