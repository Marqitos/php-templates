<!DOCTYPE HTML>
<html lang="en">
    <head>
        <title>Update webbrowser or enable javaScript!</title>
        <meta charset="utf-8">
        <meta name="robots" content="noindex">
        <link href="/css/style.css" rel="stylesheet">
    </head>

    <body>
        <div id="wrapper">
            <div class="content">

                <h1>Your browser does not support javaScript, or it is disabled.</h1>
                <h2>Update to one of the following browser versions.</h2>

                <p class="tagline">
                    <img src="/img/vink.gif" alt="Ready"> New Features
                    <img src="/img/vink.gif" alt="Ready"> Updated Technology
                    <img src="/img/vink.gif" alt="Ready"> Security Features
                    <img src="/img/vink.gif" alt="Ready"> Faster Browsing
                    <img src="/img/vink.gif" alt="Ready"> Look and Feel
                </p>

                <div class="downloads">
                    <div class="download">
                        <h3>Chrome</h3>
                        <p><a href="http://www.google.com/chrome" target="_blank">Download</a></p>
                    </div><!-- end .download -->

                    <div class="download">
                        <h3>Firefox</h3>
                        <p><a href="http://www.mozilla.org/firefox" target="_blank">Download</a></p>
                    </div><!-- end .download -->

                    <div class="download">
                        <h3>Safari</h3>
                        <p><a href="http://www.apple.com/safari/" target="_blank">Download</a></p>
                    </div><!-- end .download -->

                    <div class="download">
                        <h3>Internet Explorer</h3>
                        <p><a href="http://windows.microsoft.com/nl-nl/internet-explorer/products/ie/home" target="_blank">Download</a></p>
                    </div><!-- end .download -->

                </div><!-- end .downloads -->
            </div><!-- end .content -->
        </div><!-- end #wrapper -->
    </body>
</html>
